name: Archive Bob evidence once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-bob-evidence.yml"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download authentic screenshots
        env:
          J1_URL: "https://pikaso.cdnpk.net/private/production/5566273427/3648521629.png?token=exp=1790812800~hmac=c18d6f226698b8581407def2dac1e07f88e4af54504e2a5c612a51bc727013eb"
          J2_URL: "https://pikaso.cdnpk.net/private/production/5566273645/3648521721.png?token=exp=1790812800~hmac=6df8b27f28e91d672f6b3dd825e4d54e543d043e7b831b24fb44c30de9de82e1"
          J3_URL: "https://pikaso.cdnpk.net/private/production/5566273908/3648521817.png?token=exp=1790812800~hmac=b3fae63e7986edc74c02d9ae85700e6857c6e5bc3cb834f65ab24bb7c5f51262"
          J4_URL: "https://pikaso.cdnpk.net/private/production/5566274096/3648521949.png?token=exp=1790812800~hmac=1b499da7c3ce6682a4d4ad27ab3b937f4136c2c4e9a650d69c49d788ee2da3c1"
        run: |
          set -euo pipefail
          mkdir -p evidence/bob-sessions/screenshots
          curl -fL "$J1_URL" -o evidence/bob-sessions/screenshots/J1-quarantine-original.png
          curl -fL "$J2_URL" -o evidence/bob-sessions/screenshots/J2-three-subagents-original.png
          curl -fL "$J3_URL" -o evidence/bob-sessions/screenshots/J3-live-bob-spec-gap-original.png
          curl -fL "$J4_URL" -o evidence/bob-sessions/screenshots/J4-interactive-decision-original.png
          cat > /tmp/expected.sha256 <<'EOF'
          d5fb5f64182aced3b1d6870a0834b4a5bf2023e81dbd1e9687b922a262b8e631  evidence/bob-sessions/screenshots/J1-quarantine-original.png
          d522c3f2b38650912a42ee0c028fe40c90ddbde96fea44b2f943305c9fcdc06a  evidence/bob-sessions/screenshots/J2-three-subagents-original.png
          9cdd0922c1da3394b62d89116c5f344a8a71fb475f18028f50458e0753955d20  evidence/bob-sessions/screenshots/J3-live-bob-spec-gap-original.png
          9c1736f1961f8a2e9ea0da32b22e48cacc65b88f051325948acae52b4306b848  evidence/bob-sessions/screenshots/J4-interactive-decision-original.png
          EOF
          sha256sum -c /tmp/expected.sha256

      - name: Commit verified evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "collider-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/bob-sessions/screenshots
          git rm .github/workflows/archive-bob-evidence.yml
          git commit -m "evidence: archive authentic Bob session screenshots"
          git push origin HEAD:main
