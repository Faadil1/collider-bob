[pytest]
# `python3 -m pytest` from the repo root runs exactly the canonical suite.
# evidence/ holds committed receipts (including a compiled regression contract
# that only passes inside a decision-compiled workspace); it is never collected.
testpaths =
    tests/test_fixture.py
    tests/test_baseline.py
    api/tests
    ledger/tests
    notifications/tests
    tests/test_semantic_ci.py
    tests/test_active_repair.py
    tests/test_guard_suite.py
    tests/test_gate_registry.py
    tests/test_cloudflare_adapter.py
    tests/test_bob_native.py
norecursedirs = evidence .collider node_modules .wrangler .git
