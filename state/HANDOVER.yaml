project: collider-bob
handover_version: 3
source_of_truth: state/CURRENT.yaml
do_not_forget:
  - Real failure > fake success
  - agents are not read-only by default
  - preserve UNKNOWN rather than inventing canon
  - competitive novelty must continue to be monitored
  - x402 and other external gateways are conditional, never silently omitted
  - no completion claim without verification-before-completion
  - stage is DESIGN_COMPLETE — do not advance to DELIVER until a real run is committed
  - all Bob capability claims are INFERRED until session evidence exists; "Bob-native architecture designed; runtime proof pending"
  - correct abstention (UNKNOWN) is a first-class product success, not a failure state
  - the classifier must be rule-based for the demo; model-based classification introduces variability at the trust boundary
  - customer_identity is scoped to API and Ledger ONLY — Notifications holds notification_contact as a separate concept
  - Notifications is structurally unaffected because it never held a customer_identity claim (dependency-graph result, not a special rule)
  - the negative control uses a scope filter (Step 0) — only stub-defined fields are cross-boundary candidates; no synonym table; no model judgment
  - generation_mode must be present and truthful on all run artifacts (LIVE_BOB / PRESEEDED / SIMULATED / LOCAL / LOCAL_STUB)
  - PRESEEDED interpretation objects must never be narrated as LIVE_BOB; disclose in manifest.json known_limitations
  - prompt isolation: workstream prompts must NOT specify which value to choose; brief genuinely permits divergence
  - EXPECTED-TRUTH.md is the oracle; all 6 claims must pass before a run can be called a success
  - "green locally" not "all tests pass" — the demo shows local tests pass but cross-boundary semantic conflict is invisible to them
