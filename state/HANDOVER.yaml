  - fixtures/failed-payment/EXPECTED-TRUTH.md — ground-truth oracle for all 6 fixture claims; Notifications scope fixed
  - fixtures/failed-payment/BASELINE-CONTRACT.md — interpretation objects fixed; negative control scope rule applied
  - evidence/EVIDENCE-SCHEMA.md — generation_mode, evidence_relation, artifact_refs; fixture tables corrected
  - schemas/interpretation.schema.json — updated with all required fields including evidence_relation, artifact_refs, generation_mode
  - product/GATEWAY-REGISTRY.md — updated with new COMPLETE gates and clarified conditions
  - state/CURRENT.yaml — corrected stage; added demo_architecture block; updated next steps
