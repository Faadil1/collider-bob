  - Decision memory must change future verdicts, not merely store text.
  - Guard probes are controlled changes, not agents.
  - Historical fixture interpretations are PRESEEDED; run live-bob-2026-09-27-01 produced genuine LIVE_BOB interpretations and must be cited by its own provenance.
