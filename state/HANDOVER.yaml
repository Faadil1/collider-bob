current_signature:
  judge_memory_sentence: "Three agents can be individually right and still reveal that the specification forgot to decide."
  signature_behavior: "Independent agent disagreements become probes for missing specification decisions."
  signature_moment: "Everything looks locally valid; COLLIDER classifies the disagreement as SPEC_GAP and asks one minimal question."
  demo_emotional_arc:
    beat_1: "Everything was green — but the agents were building different realities."
    beat_2: "The specification never decided."
    beat_3: "One question repairs only what actually depended on it."
