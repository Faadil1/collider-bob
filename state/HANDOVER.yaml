canonical_decisions:
  - Category stays Semantic CI; the DECISION_REQUIRED third verdict is what earns it.
  - A raised question is closed only by authority (BLOCK); a never-contested agreement is disclosed (DISCLOSE).
  - Guard probes are fixed, bounded, controlled changes. No judge-supplied diffs.
  - Fresh-agent REPLAY remains NOT_EXECUTED / PENDING_LIVE_BOB.
  - RATIFY is the next North Star step, deliberately not in this build.
  - The money-unit divergence is a SPEC_GAP finding, not an "integration conflict"; the historical conflict definition is unchanged.

