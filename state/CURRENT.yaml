north_star:
  name: COLLIDER
  category: Semantic CI for Agentic Software Development
  tagline: "Fuzz the specification. Repair the decision. Prove the system understands it."
  judge_memory_sentence: "When AI agents disagree, COLLIDER finds the decision the specification forgot to make."
  second_act_line: "Tests say pass or fail. COLLIDER adds a third answer: nobody decided this yet."
  thesis: >
    Independent implementation agents are ambiguity probes. COLLIDER separates source-grounded
    agent drift from true specification gaps, asks the minimum human clarification, compiles the
    decision into executable artifacts, and judges every future change against decision memory
    with three verdicts: MERGE_ALLOWED, MERGE_BLOCKED, DECISION_REQUIRED. Every future agent
    change is a new ambiguity probe, so specification fuzzing continues after the first repair.
  product_loop: [PROBE, COLLIDE, ADJUDICATE, DECIDE, COMPILE, PATCH, VERIFY, REMEMBER, GUARD]
  future_step:
    name: REPLAY
    status: NOT_EXECUTED
    boundary: PENDING_LIVE_BOB
  north_star_not_built:
    - RATIFY a disclosed assumption into canon (money unit then flips DECISION_REQUIRED -> MERGE_BLOCKED)
    - decision interaction graph and conflicting-canon detection
    - COLLIDER as a required PR status check; decision memory as a portable semantic lockfile
    - pre-implementation fuzzing and fresh-agent replay with live independent agents
    - concept extraction beyond declared constants
  artifact: product/SEMANTIC-CI-ESCALATION.md

