north_star:
  name: COLLIDER
  category: Semantic CI for Agentic Software Development
  tagline: "Fuzz the specification. Repair the decision. Prove the system understands it."
  thesis: >
    Independent implementation agents can become ambiguity probes. Their disagreements can reveal
    latent decisions that the specification never made. COLLIDER separates source-grounded agent
    drift from true specification gaps, asks the minimum human clarification, compiles the decision
    into executable artifacts, and guards future work against semantic regression.
  product_loop: [PROBE, COLLIDE, ADJUDICATE, DECIDE, COMPILE, PATCH, VERIFY, REMEMBER, GUARD]
  future_step:
    name: REPLAY
    status: NOT_EXECUTED
    boundary: PENDING_LIVE_BOB

